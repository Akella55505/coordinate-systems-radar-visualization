<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Radar Visualization</title>
    <script src="https://cdn.plot.ly/plotly-2.27.0.min.js"></script>
    <script src="script.js" defer></script>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <div id="radar-plot"></div>

    <div id="controls">
        <h3>Керування радаром</h3>
        <div class="control-group">
            <label for="measurementsPerRotation">Кількість вимірювань на оберт (1-360):</label>
            <input type="number" id="measurementsPerRotation" placeholder="Напр. 180">
        </div>
        <div class="control-group">
            <label for="rotationSpeed">Швидкість обертання (0.1-60):</label>
            <input type="number" id="rotationSpeed" placeholder="Напр. 10" step="0.1">
        </div>
        <div class="control-group">
            <label for="numberOfTargets">Кількість цілей (1-50):</label>
            <input type="number" id="numberOfTargets" placeholder="Напр. 5">
        </div>
        <div class="control-group">
            <label for="targetSpeed">Швидкість цілей (0-20000):</label>
            <input type="number" id="targetSpeed" placeholder="Напр. 3000">
        </div>
        <button onclick="updateRadarConfig()">Оновити параметри</button>
        <p id="status-msg" style="color: black; font-size: 12px;"></p>
    </div>

</body>
</html>
